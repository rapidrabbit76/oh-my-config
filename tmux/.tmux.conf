# === Prefix 변경 (Ctrl+Space, Ctrl+b도 유지) ===
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# === 기본 설정 ===
set-option -g history-limit 50000
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# 이름 안 붙인 탭은 셸이면 폴더명, 아니면 실행 중인 프로그램명 (rename-window 하면 고정)
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"
set -g status-interval 3
set -g mouse on
set -sg escape-time 0
set -g allow-passthrough on
set -g pane-border-format " #{pane_index} #{pane_current_command} "
set -g pane-border-status top
set -g pane-border-lines double

# === 복사 모드 (vi) ===
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
if-shell "command -v pbcopy" {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"
} {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xclip -selection clipboard"
}

# 마우스 스크롤 속도 (기본 3 → 5줄씩)
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down

# === 플러그인 ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# yazi 파일 탐색기 (Prefix + Tab: 50% 분할)
bind Tab split-window -h -l 50% -c "#{pane_current_path}" "yazi"

# === Catppuccin 테마 ===
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# 상태 바 왼쪽: 세션 이름
set -g status-left-length 40
set -g status-left "#{E:@catppuccin_status_session}"

# 위젯 (상태 바 2번째 줄). tmux-cpu/battery가 status-right 안의 #{cpu_percentage} 등을 치환하므로
# 일단 status-right에 두고, TPM 실행 뒤 @omc_widgets로 옮김 (맨 아래)
set -g @catppuccin_date_time_text " %m/%d %H:%M"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#[bg=default] #[fg=#a6e3a1,bg=#313244]  #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-') "
set -ag status-right "#[bg=default] #[fg=#94e2d5,bg=#313244] 󰛳 #(~/.tmux/scripts/net_speed.sh) "
set -ag status-right "#[bg=default] #[fg=#89b4fa,bg=#313244]  #{cpu_percentage} "
set -ag status-right "#[bg=default] #[fg=#f9e2af,bg=#313244]  #{ram_percentage} "
set -ag status-right "#[bg=default] #[fg=#fab387,bg=#313244] 󰋊 #(~/.tmux/scripts/disk_usage.sh) "
set -ag status-right "#[bg=default] #[fg=#f5c2e7,bg=#313244] #{battery_icon} #{battery_percentage} "
set -ag status-right "#[bg=default] #[fg=#b4befe,bg=#313244] 󰩟 #(~/.tmux/scripts/public_ip.sh) "
set -ag status-right "#[bg=default] #[fg=#f38ba8,bg=#313244] #(~/.tmux/scripts/pomodoro.sh) "
set -ag status-right "#{E:@catppuccin_status_date_time}"

# 윈도우 탭 (현재 탭은 peach 번호 + 밝은 배경, 나머지는 흐리게. 긴 이름은 … 로 자름)
set -g @catppuccin_window_number_color "#{@thm_overlay_0}"
set -g @catppuccin_window_text_color "#{@thm_mantle}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_text " #[fg=#{@thm_overlay_1}]#{=/20/…:window_name}"
set -g @catppuccin_window_current_text " #[bold]#{=/30/…:window_name}"

# === 탭 레이아웃: 브라우저처럼 상단 2줄 (1줄: 세션 + 탭, 2줄: 위젯) ===
# Prefix + b 로 측면 탭 목록 모드와 전환 (scripts/tab_sidebar.sh)
set -g status-position top
set -g status 2
set -g status-format[1] "#[align=right]#{T:@omc_widgets}"
bind b run-shell "~/.tmux/scripts/tab_sidebar.sh toggle #{q:session_id} #{q:window_id}"
set-hook -g "session-window-changed[50]" "run-shell -b '~/.tmux/scripts/tab_sidebar.sh follow #{q:session_id} #{q:window_id}'"
set-hook -g "client-session-changed[50]" "run-shell -b '~/.tmux/scripts/tab_sidebar.sh follow #{q:session_id} #{q:window_id}'"

# 탭 검색 (Prefix + f): 모든 세션의 탭을 fzf로 찾아 이동, fzf 없으면 choose-tree
if-shell "command -v fzf" {
  bind f display-popup -E -w 70% -h 60% -T " 탭 검색 " "tmux list-windows -a -F '#{session_name}:#{window_index}	#{window_name}	#{pane_current_command}	#{b:pane_current_path}' | fzf --reverse --delimiter='\t' --with-nth=1.. --prompt='탭> ' | cut -f1 | { read -r t && tmux switch-client -t \"\$t\"; }"
} {
  bind f choose-tree -Zw
}

# === Pane 이동 (prefix + hjkl / Option + hjkl) ===
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# === 포모도로 타이머 (Prefix + P: 토글, Prefix + Shift+O: 정지) ===
bind P run-shell "~/.tmux/scripts/pomodoro.sh toggle"
bind O run-shell "~/.tmux/scripts/pomodoro.sh stop"

# === TPM 실행 ===
run '~/.tmux/plugins/tpm/tpm'

# 플러그인이 치환한 위젯을 2번째 줄로 옮기고, 1번째 줄(탭)에서는 뺌
run 'tmux set -g @omc_widgets "$(tmux show -gv status-right)"; tmux set -g status-right ""'

# 프롬프트/메시지가 상태바 전체 폭을 쓰도록 (catppuccin 기본값은 가운데 정렬이라
# tmux 3.6+에서 rename-window 입력이 상태바 중간에 끼어 잘림). TPM 이후에 둬야 덮어씀.
set -g message-style "fg=#cdd6f4,bg=#313244,fill=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244,fill=#313244"
